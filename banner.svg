<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Baybora Demir">
  <defs>
    <!-- Background: deep Premier League purple → subtle vignette -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0028"/>
      <stop offset="50%" stop-color="#37003c"/>
      <stop offset="100%" stop-color="#1a0028"/>
    </linearGradient>
    <!-- Text gradient: PL brand purples with magenta finish -->
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#04F5FF"/>
      <stop offset="35%" stop-color="#963CFF"/>
      <stop offset="75%" stop-color="#E90052"/>
      <stop offset="100%" stop-color="#FF2882"/>
    </linearGradient>
    <!-- Subtle scanline pattern for tech feel -->
    <pattern id="scan" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.02"/>
    </pattern>
    <!-- Soft glow filter for the text -->
    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="200" fill="url(#bg)"/>
  <rect width="1200" height="200" fill="url(#scan)"/>

  <!-- Top / bottom accent lines -->
  <rect x="0" y="0" width="1200" height="1" fill="#963CFF" fill-opacity="0.4"/>
  <rect x="0" y="199" width="1200" height="1" fill="#E90052" fill-opacity="0.4"/>

  <!-- Corner tick marks (technical drawing feel) -->
  <g stroke="#963CFF" stroke-width="1" stroke-opacity="0.35" fill="none">
    <path d="M12,12 L12,32 M12,12 L32,12"/>
    <path d="M1188,12 L1188,32 M1188,12 L1168,12"/>
    <path d="M12,188 L12,168 M12,188 L32,188"/>
    <path d="M1188,188 L1188,168 M1188,188 L1168,188"/>
  </g>

  <!-- Name — gradient text with soft glow -->
  <text x="600" y="118"
        text-anchor="middle"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="82"
        letter-spacing="-2"
        fill="url(#txt)"
        filter="url(#glow)">Baybora Demir</text>

  <!-- Subtitle -->
  <text x="600" y="160"
        text-anchor="middle"
        font-family="'IBM Plex Mono', 'Fira Code', 'Menlo', monospace"
        font-weight="500"
        font-size="14"
        letter-spacing="6"
        fill="#04F5FF"
        fill-opacity="0.75">S O F T W A R E &#160;&#160;D E V E L O P E R</text>
</svg>
