<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Baybora Demir — software developer">
  <defs>
    <!-- Cyan → blue gradient for the subtitle strip (Image 2 vibe) -->
    <linearGradient id="cyanStrip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4EC7EE"/>
      <stop offset="55%" stop-color="#4AB6EE"/>
      <stop offset="100%" stop-color="#4A9EF3"/>
    </linearGradient>

    <!-- Typing reveal mask -->
    <mask id="typeMask" maskUnits="userSpaceOnUse">
      <rect x="0" y="180" width="0" height="80" fill="white">
        <animate attributeName="width"
                 values="0;1200;1200;0;0"
                 keyTimes="0;0.35;0.75;0.95;1"
                 dur="5s"
                 repeatCount="indefinite"/>
      </rect>
    </mask>

    <!-- Blinking cursor animation -->
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- ============ TOP: solid deep PL purple ============ -->
  <rect x="0" y="0" width="1200" height="180" fill="#3B0432"/>

  <!-- Thin cyan hairline separator -->
  <rect x="0" y="179" width="1200" height="1.5" fill="#4EC7EE" opacity="0.35"/>

  <!-- Subtle top texture for depth -->
  <rect x="0" y="0" width="1200" height="1" fill="#04F5FF" opacity="0.15"/>

  <!-- Name — clean white bold, PL-style -->
  <text x="600" y="118"
        text-anchor="middle"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif"
        font-weight="700"
        font-size="76"
        letter-spacing="-2"
        fill="#FFFFFF">Baybora Demir</text>

  <!-- Small accent dot / marker under the name (PL brand touch) -->
  <circle cx="600" cy="152" r="3" fill="#04F5FF"/>

  <!-- ============ BOTTOM: cyan-blue strip with animated "software developer" ============ -->
  <rect x="0" y="180" width="1200" height="80" fill="url(#cyanStrip)"/>

  <!-- The animated text — clipped by growing mask to create typing effect -->
  <g mask="url(#typeMask)">
    <text x="600" y="230"
          text-anchor="middle"
          font-family="'IBM Plex Mono', 'Fira Code', 'Menlo', monospace"
          font-weight="600"
          font-size="30"
          letter-spacing="3"
          fill="#37003C">software developer</text>
  </g>

  <!-- Blinking cursor — placed at approximate end-of-text position -->
  <rect x="758" y="210" width="3" height="30" fill="#37003C" style="animation: blink 1s infinite;"/>
</svg>
